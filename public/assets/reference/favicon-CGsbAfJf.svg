<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Pitch-black studio background with top spotlight pool -->
    <radialGradient id="bgSpot" cx="50%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#1c2029"/>
      <stop offset="52%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>

    <!-- Satin metallic silver-white car body gradient -->
    <linearGradient id="bodyMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f5fa"/>
      <stop offset="45%" stop-color="#b8c2d1"/>
      <stop offset="100%" stop-color="#303744"/>
    </linearGradient>

    <!-- Glass roof bronze/smoked reflection -->
    <linearGradient id="canopyGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c6c5e" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#252224" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c0d11"/>
    </linearGradient>

    <!-- Continuous crimson rear light bar outer bloom -->
    <radialGradient id="tailBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1028" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#ff081e" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff081e" stop-opacity="0"/>
    </radialGradient>

    <!-- Continuous crimson rear light strip gradient -->
    <linearGradient id="tailCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1428"/>
      <stop offset="18%" stop-color="#ff5a68"/>
      <stop offset="50%" stop-color="#fff0f2"/>
      <stop offset="82%" stop-color="#ff5a68"/>
      <stop offset="100%" stop-color="#ff1428"/>
    </linearGradient>

    <!-- Cold-gas cyan thruster plume gradient -->
    <linearGradient id="plumeCyan" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="32%" stop-color="#64ecff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#0095ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0050ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor red reflection pool -->
    <radialGradient id="floorRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1830" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff1830" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded squircle icon base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgSpot)" stroke="#1f2430" stroke-width="1"/>

  <!-- Subtle perspective horizon & speed lines in background -->
  <path d="M32 16 L6 56 M32 16 L58 56" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-linecap="round"/>

  <!-- Ambient floor glow from tail strip & thrusters -->
  <ellipse cx="32" cy="49" rx="22" ry="4.5" fill="url(#floorRed)"/>

  <!-- Twin cold-gas SpaceX thruster plumes beneath diffuser -->
  <path d="M22.5 41.5 L18.5 57.5 L26.5 57.5 Z" fill="url(#plumeCyan)"/>
  <path d="M41.5 41.5 L37.5 57.5 L45.5 57.5 Z" fill="url(#plumeCyan)"/>
  <!-- Center ventral hover glow -->
  <ellipse cx="32" cy="43.5" rx="9" ry="2.2" fill="#64ecff" fill-opacity="0.55"/>

  <!-- Rear tires / wide stance haunches shadow -->
  <rect x="8.5" y="34" width="8.5" height="10.5" rx="2.2" fill="#07080b"/>
  <rect x="47" y="34" width="8.5" height="10.5" rx="2.2" fill="#07080b"/>

  <!-- Sculpted Roadster rear body shell (wide low wedge haunches + tapered cabin) -->
  <path d="M7.5 34.5
           C7.5 28.5, 11.5 24.5, 16.5 23.2
           L21.5 16.8
           C23.2 15.2, 26.5 14.5, 32 14.5
           C37.5 14.5, 40.8 15.2, 42.5 16.8
           L47.5 23.2
           C52.5 24.5, 56.5 28.5, 56.5 34.5
           L55.2 40.5
           C54.6 42.2, 52.8 43.0, 50.0 43.0
           L14.0 43.0
           C11.2 43.0, 9.4 42.2, 8.8 40.5
           Z"
        fill="url(#bodyMetal)"/>

  <!-- Tapered glass roof / rear canopy -->
  <path d="M22.8 17.6
           C24.5 16.3, 27.6 15.8, 32 15.8
           C36.4 15.8, 39.5 16.3, 41.2 17.6
           L44.8 23.8
           C40.5 24.8, 36.4 25.2, 32 25.2
           C27.6 25.2, 23.5 24.8, 19.2 23.8
           Z"
        fill="url(#canopyGlass)"/>

  <!-- Crisp shoulder crease highlights (left & right rear haunches) -->
  <path d="M10.2 30.2 C13.5 26.2, 18.2 25.0, 25.0 25.4" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M53.8 30.2 C50.5 26.2, 45.8 25.0, 39.0 25.4" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Recessed dark rear fascia & carbon diffuser -->
  <path d="M9.5 32.2
           Q32 29.8 54.5 32.2
           L53.6 41.2
           Q32 42.4 10.4 41.2
           Z"
        fill="#080a0e"/>

  <!-- Carbon diffuser vertical strakes + thruster nozzles -->
  <path d="M18 37.5 L18 42 M26 37.2 L26 42 M32 37.0 L32 42.2 M38 37.2 L38 42 M46 37.5 L46 42"
        stroke="#252c38" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="22.5" cy="40.2" r="2.1" fill="#e8fbff" stroke="#3ad8ff" stroke-width="0.9"/>
  <circle cx="41.5" cy="40.2" r="2.1" fill="#e8fbff" stroke="#3ad8ff" stroke-width="0.9"/>

  <!-- Continuous red rear light bar outer bloom -->
  <ellipse cx="32" cy="32.2" rx="26" ry="5.5" fill="url(#tailBloom)"/>

  <!-- Continuous unbroken crimson-red tail strip (fender-to-fender arch) -->
  <path d="M9.8 33.0 Q32 30.2 54.2 33.0"
        fill="none" stroke="#ff0a20" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M10.2 33.0 Q32 30.2 53.8 33.0"
        fill="none" stroke="url(#tailCore)" stroke-width="1.9" stroke-linecap="round"/>
</svg>
